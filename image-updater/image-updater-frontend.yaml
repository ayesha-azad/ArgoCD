apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: frontend-ns
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/frontend-ns"
    gitConfig:
      branch: "main"
      writeBackTarget: "kustomization:frontend-ns"
  commonUpdateSettings:
    updateStrategy: "semver"
    allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
  applicationRefs:
    - namePattern: "frontend-ns"
      images:
        - alias: "frontend-app"
          imageName: "ayeshaazad/ajk-gw-static-website"
          manifestTargets:
            kustomize:
              name: "ayeshaazad/ajk-gw-static-website"
