apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: frontend-image-updater
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/frontend-git-creds"
    gitConfig:
      branch: "main"
      writeBackTarget: "kustomization:../frontend-app"

  applicationRefs:
    - namePattern: "frontend-ns"
      images:
        - alias: "frontend-app"
          imageName: "ayeshaazad/ajk-gw-static-website:1.0.0"
          commonUpdateSettings:
            updateStrategy: "semver"
            allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
          manifestTargets:
            kustomize:
              name: "ayeshaazad/ajk-gw-static-website"
