apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-ns
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: frontend=ayeshaazad/ajk-gw-static-website
    argocd-image-updater.argoproj.io/frontend.update-strategy: semver
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/frontend-secret
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/write-back-target: kustomization

spec:
  project: frontend-project
  source:
    repoURL: https://github.com/ayesha-azad/ArgoCD.git
    targetRevision: HEAD
    path: frontend-app
  destination:
    namespace: frontend-ns
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
