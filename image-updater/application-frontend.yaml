apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-ns
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: ayeshaazad/ajk-gw-static-website:x
    argocd-image-updater.argoproj.io/ajk-gw-static-website.update-strategy: semver
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  project: frontend-project
  source:
    repoURL: https://github.com/ayesha-azad/ArgoCD.git
    targetRevision: HEAD
    path: frontend-app
  destination:
    namespace: frontend-ns
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
