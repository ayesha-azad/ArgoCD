apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: animated-website-dev-ns
  namespace: argocd
spec:
  project: animated-website-project
  source:
    repoURL: https://github.com/ayesha-azad/ArgoCD.git
    targetRevision: HEAD
    path: animated-website
  destination:
    name: kind-dev-cluster
    namespace: animated-website-dev-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
