apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  project: app-of-apps-project
  destination:
    namespace: nginx
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/ayesha-azad/ArgoCD.git
    targetRevision: main
    path: nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
