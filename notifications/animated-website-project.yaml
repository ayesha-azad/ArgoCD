apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: animated-website-project
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.email: "ayeshaazad8698@gmail.com"
