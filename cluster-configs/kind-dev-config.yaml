kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-kind-cluster

networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
        - "192.168.1.5"      # YOUR IP - REPLACE WITH THIS
        - "127.0.0.1"
        - "localhost"
        - "0.0.0.0"
        
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0
  
  - role: worker
    image: kindest/node:v1.35.0
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081  # Different port for dev
        protocol: TCP
      - containerPort: 443
        hostPort: 8443  # Different port for dev
        protocol: TCP
  
  - role: worker
    image: kindest/node:v1.35.0
    
  - role: worker
    image: kindest/node:v1.35.0
