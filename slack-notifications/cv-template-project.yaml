apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cv-template-project
  namespace: argocd
spec:
  description: "CV Template Project"
  sourceRepos:
    - "https://github.com/ayesha-azad/ArgoCD.git"
  destinations:
    - namespace: cv-template-prod-ns
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
