apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: animated-website-dev-app
  namespace: argocd
spec:
  project: dev-animated-website-project
  destination:
    namespace: animated-website-dev-ns
    server: "https://dev-kind-cluster-control-plane:6443"
  source:
    repoURL: https://github.com/ayesha-azad/ArgoCD.git
    targetRevision: main
    path: animated-website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
