apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devops-showcase-staging-project
  namespace: argocd
spec:
  description: "Staging environment project"
  sourceRepos:
    - "https://github.com/ayesha-azad/ArgoCD.git"
  destinations:
    - namespace: devops-showcase-staging-ns
      server: "https://staging-cluster-control-plane:6443"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
